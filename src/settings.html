<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Настройки</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background:#151515; color:#eee; margin:0; padding:20px; }
  h2 { font-size:15px; text-transform:uppercase; opacity:.6; margin:20px 0 10px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #262626; }
  .row div.label { max-width:340px; }
  .row .name { font-size:14px; }
  .row .desc { font-size:12px; opacity:.55; margin-top:2px; }
  label.switch { position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0; }
  label.switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:#444; border-radius:22px; transition:.15s; }
  .slider:before { content:""; position:absolute; height:16px; width:16px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.15s; }
  input:checked + .slider { background:#ff3d3d; }
  input:checked + .slider:before { transform:translateX(18px); }
  #empty { opacity:.5; font-size:13px; padding:10px 0; }
</style>
</head>
<body>
  <h2>Основное</h2>
  <div class="row">
    <div class="label"><div class="name">Discord Rich Presence</div><div class="desc">Показывать текущий трек в статусе Discord</div></div>
    <label class="switch"><input type="checkbox" id="discordEnabled"><span class="slider"></span></label>
  </div>
  <div class="row">
    <div class="label"><div class="name">Загружать Chrome-расширения</div><div class="desc">Требует перезапуск приложения</div></div>
    <label class="switch"><input type="checkbox" id="loadExtensions"><span class="slider"></span></label>
  </div>

  <h2>Аддоны (PulseSync)</h2>
  <div id="addons"></div>
  <div id="empty" style="display:none">Аддонов не найдено — положи их в папку addons/</div>

<script>
async function init() {
  const settings = await window.api.getSettings();
  document.getElementById('discordEnabled').checked = settings.discordEnabled;
  document.getElementById('loadExtensions').checked = settings.loadExtensions;

  document.getElementById('discordEnabled').onchange = e => window.api.setSetting('discordEnabled', e.target.checked);
  document.getElementById('loadExtensions').onchange = e => window.api.setSetting('loadExtensions', e.target.checked);

  const addons = await window.api.listAddons();
  const container = document.getElementById('addons');
  if (addons.length === 0) document.getElementById('empty').style.display = 'block';
  for (const a of addons) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="label"><div class="name">${a.name}</div><div class="desc">${a.description}</div></div>
      <label class="switch"><input type="checkbox" ${a.enabled ? 'checked' : ''} data-id="${a.id}"><span class="slider"></span></label>
    `;
    row.querySelector('input').onchange = e => window.api.toggleAddon(a.id, e.target.checked);
    container.appendChild(row);
  }
}
init();
</script>
</body>
</html>
